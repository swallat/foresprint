[env]
FORESPRINT_DATA = "teams"
# Language of the generated reports (FORECAST.md): "en" or "de".
FORESPRINT_LANG = "en"

[tasks.sf]
description = "run foresprint, e.g. `mise run sf -- forecast team-a` (install it first: https://github.com/swallat/foresprint/blob/v1/docs/installation.md)"
run = "foresprint"
