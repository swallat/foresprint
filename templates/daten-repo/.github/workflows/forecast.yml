# Vorlage für ein Daten-Repository: prüft jede Änderung und aktualisiert FORECAST.md.
name: Forecast

on:
  push:
    branches: [main]
    paths: ["teams/**"]
  pull_request:
    paths: ["teams/**"]
  schedule:
    # Werktags 06:00 UTC, damit „laufender Sprint“ und Prognose aktuell bleiben.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Daten prüfen
        run: mise run sf -- pruefen
      - name: Berichte erzeugen
        if: github.event_name != 'pull_request'
        run: mise run sf -- bericht
      - name: Berichte committen
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "sprintforecast"
          git config user.email "sprintforecast@users.noreply.github.com"
          git add teams/*/FORECAST.md
          git diff --cached --quiet || git commit -m "Forecast aktualisiert [skip ci]"
          git push
