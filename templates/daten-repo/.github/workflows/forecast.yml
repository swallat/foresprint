# Template for a data repository: checks every change and updates FORECAST.md.
name: Forecast

on:
  push:
    branches: [main]
    paths: ["teams/**"]
  pull_request:
    paths: ["teams/**"]
  schedule:
    # Weekdays at 06:00 UTC so that "current sprint" and the forecast stay up to date.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      # The command line without the window. Pin the version here and raise it when you update;
      # pre-releases (1.0.0-beta.N) are only found by their exact version.
      - name: Install foresprint
        env:
          FORESPRINT_VERSION: "1.0.0"
          FORESPRINT_VARIANT: cli
          FORESPRINT_NO_SHORTCUT: "1"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/swallat/foresprint/v${FORESPRINT_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check data
        run: mise run sf -- check
      - name: Generate reports
        if: github.event_name != 'pull_request'
        run: mise run sf -- report
      - name: Commit reports
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "foresprint"
          git config user.email "foresprint@users.noreply.github.com"
          git add teams/*/FORECAST.md
          git diff --cached --quiet || git commit -m "Update forecast [skip ci]"
          git push
