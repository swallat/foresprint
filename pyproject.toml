[project]
name = "sprintforecast"
version = "0.7.0"
description = "Velocity and capacity forecast for Scrum teams with Git as the data store"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "Sebastian Wallat", email = "873008+swallat@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "holidays>=0.106",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
sprintforecast = "sprintforecast:main"

# Doppelklick-Start (unter Windows ohne Konsolenfenster): Weboberfläche als App.
[project.gui-scripts]
sprintforecast-app = "sprintforecast:app_main"

[project.optional-dependencies]
web = [
    "streamlit>=1.66.0",
]
excel = [
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
]
# Jira import (sprintforecast tickets --fetch); the OS keychain needs "keyring" in addition.
jira = [
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "openpyxl>=3.1",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "xlsxwriter>=3.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Deutsche Texte verwenden bewusst Gedankenstriche und Multiplikationszeichen.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Browsertests: lange JavaScript-Texte und Erwartungstexte bleiben je Stück auf einer Zeile.
"tests/e2e/*" = ["E501"]
# Translation catalog: long texts bleiben je Eintrag auf einer Zeile.
"src/sprintforecast/locale_de.py" = ["E501"]
# Windows-Skript: Beispiele mit langen Befehlszeilen und PowerShell-Code in einem Text.
"tests/test_windows_script.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browsertests (tests/e2e) brauchen einen installierten Browser und laufen nur auf Wunsch:
# `uv run pytest -m e2e` (siehe tests/e2e/README.md).
addopts = "-m 'not e2e and not jira_live'"
markers = [
    "e2e: Browsertests mit Playwright gegen die laufende App (nur mit -m e2e)",
    "jira_live: Test gegen eine echte Jira-Instanz (nur mit -m jira_live und SPRINTFORECAST_JIRA_*)",
]
