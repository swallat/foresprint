name: CI

on:
  # Branches with an open PR run only via pull_request (otherwise every push would run twice).
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the superseded run; on main every run finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Optionally on the self-hosted runner: repository variable SELF_HOSTED=true. Fork PRs always
# run in the cloud (public repository); SELF_HOSTED=false switches back immediately.
jobs:
  test:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","sprintforecast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - name: No spreadsheets in the repository
        run: |
          if git ls-files | grep -iE '\.(xlsx|xlsm|xls)$'; then
            echo "::error::Spreadsheets must not be committed (real team data)."
            exit 1
          fi
      - uses: jdx/mise-action@v3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv run foresprint --data examples/teams check

  build:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","sprintforecast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14

  # Browser tests (Playwright, Chromium) against the running web UI; separate from the fast
  # tests so that a missing browser or a slow run does not hold them up.
  e2e:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","sprintforecast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A PR that only changes documentation (docs/ and *.md) needs no browser run. The job
      # still runs and reports success so that the required check "e2e" is satisfied; on main
      # and for every other change the tests run as before.
      - name: Check affected files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            other=$(git diff --name-only "$BASE" HEAD | grep -vE '^(docs/|[^/]+\.md$)' || true)
            if [ -z "$other" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "E2E tests: $run"
      - if: steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@v3
      - if: steps.scope.outputs.run == 'true'
        run: uv sync --locked --all-extras
      # The self-hosted runner has no sudo; the system packages for Chromium are already
      # installed there, so only the browser itself.
      - name: Install Chromium (GitHub-hosted, with system packages)
        if: steps.scope.outputs.run == 'true' && runner.environment == 'github-hosted'
        run: uv run playwright install --with-deps chromium
      - name: Install Chromium (self-hosted, without system packages)
        if: steps.scope.outputs.run == 'true' && runner.environment == 'self-hosted'
        run: uv run playwright install chromium
      - if: steps.scope.outputs.run == 'true'
        run: uv run pytest -m e2e -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: test-results/e2e/
          retention-days: 7
