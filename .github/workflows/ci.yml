name: CI

on:
  # Branches mit offenem PR laufen nur über pull_request (sonst liefe jeder Push doppelt).
  push:
    branches: [main]
  pull_request:

# Ein neuer Push auf denselben Branch oder PR bricht den überholten Lauf ab; auf main läuft
# jeder Lauf zu Ende.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Optional auf dem eigenen Runner: Repository-Variable SELF_HOSTED=true. Fork-PRs laufen
# immer in der Cloud (öffentliches Repository); SELF_HOSTED=false schaltet sofort zurück.
jobs:
  test:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","sprintforecast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - name: Keine Tabellenkalkulationen im Repository
        run: |
          if git ls-files | grep -iE '\.(xlsx|xlsm|xls)$'; then
            echo "::error::Tabellenkalkulationen dürfen nicht ins Repository (echte Team-Daten)."
            exit 1
          fi
      - uses: jdx/mise-action@v3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv run sprintforecast --daten examples/teams pruefen

  build:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","sprintforecast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14

  # Browsertests (Playwright, Chromium) gegen die laufende Weboberfläche; getrennt von den
  # schnellen Tests, damit ein fehlender Browser oder ein langsamer Lauf sie nicht aufhält.
  e2e:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","sprintforecast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Ein PR, der nur Dokumentation (docs/ und *.md) ändert, braucht keinen Browserlauf. Der
      # Job läuft trotzdem und meldet Erfolg, damit die Pflichtprüfung „e2e“ erfüllt ist; auf
      # main und bei jeder anderen Änderung laufen die Tests wie bisher.
      - name: Betroffene Dateien prüfen
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            other=$(git diff --name-only "$BASE" HEAD | grep -vE '^(docs/|[^/]+\.md$)' || true)
            if [ -z "$other" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "E2E-Tests: $run"
      - if: steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@v3
      - if: steps.scope.outputs.run == 'true'
        run: uv sync --locked --all-extras
      # Auf dem selbstgehosteten Runner fehlt sudo; die Systempakete für Chromium sind dort
      # bereits installiert, daher nur der Browser selbst.
      - name: Chromium installieren (GitHub-gehostet, mit Systempaketen)
        if: steps.scope.outputs.run == 'true' && runner.environment == 'github-hosted'
        run: uv run playwright install --with-deps chromium
      - name: Chromium installieren (selbstgehostet, ohne Systempakete)
        if: steps.scope.outputs.run == 'true' && runner.environment == 'self-hosted'
        run: uv run playwright install chromium
      - if: steps.scope.outputs.run == 'true'
        run: uv run pytest -m e2e -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-bilder
          path: test-results/e2e/
          retention-days: 7
