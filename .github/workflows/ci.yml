name: CI

on:
  push:
  pull_request:

# Optional auf dem eigenen Runner: Repository-Variable SELF_HOSTED=true. Fork-PRs laufen
# immer in der Cloud (öffentliches Repository); SELF_HOSTED=false schaltet sofort zurück.
jobs:
  test:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","sprintforecast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - name: Keine Tabellenkalkulationen im Repository
        run: |
          if git ls-files | grep -iE '\.(xlsx|xlsm|xls)$'; then
            echo "::error::Tabellenkalkulationen dürfen nicht ins Repository (echte Team-Daten)."
            exit 1
          fi
      - uses: jdx/mise-action@v3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv run sprintforecast --daten examples/teams pruefen

  build:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","sprintforecast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14

  # Browsertests (Playwright, Chromium) gegen die laufende Weboberfläche; getrennt von den
  # schnellen Tests, damit ein fehlender Browser oder ein langsamer Lauf sie nicht aufhält.
  e2e:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","sprintforecast"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: uv sync --locked --all-extras
      # Auf dem selbstgehosteten Runner fehlt sudo; die Systempakete für Chromium sind dort
      # bereits installiert, daher nur der Browser selbst.
      - name: Chromium installieren (GitHub-gehostet, mit Systempaketen)
        if: runner.environment == 'github-hosted'
        run: uv run playwright install --with-deps chromium
      - name: Chromium installieren (selbstgehostet, ohne Systempakete)
        if: runner.environment == 'self-hosted'
        run: uv run playwright install chromium
      - run: uv run pytest -m e2e -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-bilder
          path: test-results/e2e/
          retention-days: 7
