name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keine Tabellenkalkulationen im Repository
        run: |
          if git ls-files | grep -iE '\.(xlsx|xlsm|xls)$'; then
            echo "::error::Tabellenkalkulationen dürfen nicht ins Repository (echte Team-Daten)."
            exit 1
          fi
      - uses: jdx/mise-action@v3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv run sprintforecast --daten examples/teams pruefen

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14

  # Browsertests (Playwright, Chromium) gegen die laufende Weboberfläche; getrennt von den
  # schnellen Tests, damit ein fehlender Browser oder ein langsamer Lauf sie nicht aufhält.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-bilder
          path: test-results/e2e/
          retention-days: 7
