name: Release

# Baut Wheel und Quellpaket und schreibt die Release-Seite, sobald ein Versions-Tag (v0.4.2 …)
# gepusht wird. Mit „Run workflow“ lässt sich das Release für einen vorhandenen Tag nachholen
# oder – bei bestehender Release-Seite – die Dateien ersetzen.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Tag, z. B. v0.4.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Tag und Version vergleichen
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $version in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Release-Seite schreiben
        run: |
          files=(dist/*.whl dist/*.tar.gz)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            newest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
            if [ "$TAG" = "$newest" ]; then latest="--latest"; else latest="--latest=false"; fi
            gh release create "$TAG" "${files[@]}" --verify-tag --title "${TAG#v}" \
              --generate-notes "$latest"
          fi
