name: Release

# Builds the wheel and the source distribution and writes the release page as soon as a version
# tag (v0.4.2 …) is pushed. "Run workflow" creates the release for an existing tag after the
# fact or, if the release page already exists, replaces its files.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v0.4.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Compare tag and version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Write release page
        run: |
          files=(dist/*.whl dist/*.tar.gz)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            newest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
            if [ "$TAG" = "$newest" ]; then latest="--latest"; else latest="--latest=false"; fi
            gh release create "$TAG" "${files[@]}" --verify-tag --title "${TAG#v}" \
              --generate-notes "$latest"
          fi

  # Publishes the files built above on PyPI through Trusted Publishing (OIDC, no API token).
  # Needs the environment "pypi" and a trusted publisher entry on pypi.org, see docs/releasing.md.
  # A manual run on an already published tag also asks for the approval; the upload itself is
  # then a no-op because PyPI never accepts a version twice (skip-existing).
  # The package name from pyproject.toml must be the PyPI project name (foresprint).
  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/foresprint/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check the files
        run: pipx run twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
